# Render Blueprint for the HomeVault API (free plan).
# Render dashboard -> New -> Blueprint -> pick this repo. You'll be asked for the values marked sync: false.
services:
  - type: web
    name: homevault-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false          # Neon connection string (direct, with ?sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false          # e.g. https://homevault.vercel.app
      - key: PUBLIC_API_URL
        sync: false          # e.g. https://homevault-api.onrender.com
      - key: CLOUDINARY_URL
        sync: false          # cloudinary://<key>:<secret>@<cloud_name>
