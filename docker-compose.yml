# Local PostgreSQL for development.  Start with:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: homevault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: homevault
      POSTGRES_PASSWORD: homevault
      POSTGRES_DB: homevault
    ports:
      - "5434:5432"
    volumes:
      - homevault-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homevault -d homevault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homevault-pgdata:
